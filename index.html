<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate XO - Welcome</title>
    <style>
        body {
            margin: 0; padding: 0; height: 100vh;
            /* رجوع الخلفية الأصلية بالتوهج النيون من الزوايا */
            background-color: #05060a;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(157, 0, 255, 0.1), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.08), transparent 40%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-family: 'Arial Black', Gadget, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* توقيع عمر فريد بشكل شيك */
        .signature {
            position: absolute;
            top: 40px;
            font-size: 0.8rem;
            color: #fff;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            opacity: 0.6;
            text-shadow: 0 0 10px rgba(188, 19, 254, 0.5);
            animation: pulseFade 3s infinite ease-in-out;
            z-index: 20;
        }

        @keyframes pulseFade {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        #neural-bg {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        .title-container {
            text-align: center;
            line-height: 0.9;
            margin-bottom: 60px;
            perspective: 1000px;
            z-index: 10;
        }

        .title-part {
            display: block;
            font-size: 5rem;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 
                0 1px 0 #ccc, 0 2px 0 #c5c5c5, 0 3px 0 #bbb, 0 4px 0 #b5b5b5,
                0 5px 0 #aaa, 0 6px 1px rgba(0,0,0,.1), 0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3), 0 3px 5px rgba(0,0,0,.2), 
                0 5px 10px rgba(0,0,0,.25), 0 10px 10px rgba(0,0,0,.2), 
                0 20px 20px rgba(0,0,0,.15);
            transform: rotateX(20deg);
        }

        .subtitle {
            font-size: 1.5rem;
            color: #00f3ff;
            margin-top: 20px;
            letter-spacing: 5px;
            font-weight: lighter;
            text-shadow: 0 0 10px #00f3ff;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            z-index: 10;
        }

        .start-btn, .how-btn {
            position: relative;
            width: 300px;
            padding: 20px 0;
            font-size: 1.8rem;
            color: white;
            background: transparent;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.4s;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid;
            letter-spacing: 1px;
        }

        .start-btn { border-color: #ff0055; box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); }
        .start-btn:hover { background: #ff0055; box-shadow: 0 0 50px #ff0055; transform: translateY(-3px) scale(1.05); }

        .how-btn { border-color: #bc13fe; box-shadow: 0 0 20px rgba(188, 19, 254, 0.3); }
        .how-btn:hover { background: #bc13fe; box-shadow: 0 0 50px #bc13fe; transform: translateY(-3px) scale(1.05); }
    </style>
    <meta name="theme-color" content="#05060a">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <script>
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    </script>
</head>
<body>

    <canvas id="neural-bg"></canvas>

    <div class="signature">BY OMAR FARID</div>

    <div class="title-container">
        <span class="title-part">Play XO</span>
        <span class="subtitle">IN ANOTHER WAY</span>
    </div>

    <div class="menu-container">
        <a href="Login.html" class="start-btn" id="startBtn">START GAME</a>
        <a href="howtoplay.html" class="how-btn">TACTICAL GUIDE</a>
    </div>

    <script>
        try { if (localStorage.getItem("xo_hint")) document.getElementById("startBtn").href = "Bbb.html"; } catch(e) {}
    </script>
    <script>
        const canvas = document.getElementById('neural-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const numParticles = 80;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.radius = Math.random() * 2;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(188, 19, 254, 0.8)';
                ctx.fill();
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
        }

        function init() {
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.draw();
                p.update();
            });
            connect();
            requestAnimationFrame(animate);
        }

        function connect() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 243, 255, ${1 - distance/150})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            init();
        });

        init();
        animate();
    </script>
</body>
</html>
