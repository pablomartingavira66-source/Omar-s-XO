<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Select - Ultimate XO</title>
    <style>
        #global-loader {
            position: fixed; inset: 0; 
            background: radial-gradient(circle at center, #001f15 0%, #020503 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100000; overflow: hidden;
        }
        .loader-grid-bg {
            position: absolute; inset: 0;
            display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
            opacity: 0.04; pointer-events: none;
        }
        .loader-grid-bg span { display:flex; align-items:center; justify-content:center; font-size: 5rem; font-weight: 900; color: #00ff66; }
        .loader-xo-wrap { display: flex; gap: 20px; margin-bottom: 35px; align-items: center; }
        .loader-letter { font-size: 4rem; font-weight: 900; opacity: 0; animation: letterPop 0.4s cubic-bezier(0.175,0.885,0.32,1.275) forwards; }
        .loader-letter.X { color: #fff; text-shadow: 0 0 30px #fff, 0 0 60px rgba(255,255,255,0.5); animation-delay: 0.1s; }
        .loader-letter.vs { color: rgba(255,255,255,0.2); font-size: 1.5rem; animation-delay: 0.2s; }
        .loader-letter.O { color: #00ff66; text-shadow: 0 0 30px #00ff66, 0 0 60px rgba(0,255,102,0.5); animation-delay: 0.3s; }
        @keyframes letterPop { from{opacity:0;transform:scale(0) rotate(-15deg)} to{opacity:1;transform:scale(1) rotate(0deg)} }
        .loader-box { text-align: center; width: 280px; position: relative; z-index: 1; }
        .loader-title { color: rgba(255,255,255,0.4); font-size: 0.75rem; font-weight: 700; letter-spacing: 6px; margin-bottom: 15px; text-transform: uppercase; }
        .bar-container { width: 100%; height: 3px; background: rgba(255,255,255,0.06); border-radius: 20px; overflow: hidden; position: relative; }
        #fill-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #00ff66, #00f3ff, #00ffaa); transition: width 0.2s ease; border-radius:20px; }
        .loader-percent { color: rgba(255,255,255,0.3); font-size: 0.8rem; margin-top: 12px; font-family: monospace; font-weight: bold; letter-spacing: 3px; }

        body {
            margin: 0; padding: 0; 
            background-color: #010603;
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; box-sizing: border-box;
            position: relative;
        }

        .stars-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: radial-gradient(circle at center, #021a0e 0%, #010603 100%);
        }

        .game-title {
            color: #ffffff; font-size: 22px; font-weight: 900; text-transform: uppercase;
            text-align: center; letter-spacing: 3px; margin-bottom: 60px; margin-top: -30px;
            z-index: 10; text-shadow: 0 0 12px #00ff66, 0 0 25px #00ff66;
        }

        .menu-container { 
            text-align: center; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; gap: 35px; z-index: 10; width: 100%; 
        }

        .mode-btn {
            width: 340px; padding: 20px 24px; font-size: 22px; font-weight: bold;
            background: rgba(255, 255, 255, 0.03); border: 2px solid; border-radius: 60px; 
            cursor: pointer; transition: 0.3s all ease-in-out; color: white;
            text-transform: uppercase; display: flex; flex-direction: column; align-items: center;
            position: relative; backdrop-filter: blur(3px);
        }

        .ai-neon { border-color: #00ff66; color: #00ff66; box-shadow: 0 0 18px rgba(0, 255, 102, 0.3); } 
        .ai-neon:hover { background: #00ff66; color: #000000; box-shadow: 0 0 40px #00ff66; transform: scale(1.05); }

        .online-neon { border-color: #ff0055; color: #ff0055; box-shadow: 0 0 18px rgba(255, 0, 85, 0.35); }
        .online-neon:hover { background: #ff0055; color: #ffffff; box-shadow: 0 0 45px #ff0055; transform: scale(1.05); }

        .btn-subtext { display: block; font-size: 12px; margin-top: 6px; font-weight: normal; opacity: 0.9; color: inherit; letter-spacing: 1px; }
    
        .locked-btn {
            opacity: 0.45;
            cursor: not-allowed !important;
            position: relative;
            filter: grayscale(0.3);
        }
        .locked-btn:hover {
            transform: none !important;
            background: transparent !important;
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.35) !important;
            color: #ff0055 !important;
        }
        .lock-icon {
            position: absolute;
            top: -10px;
            right: 16px;
            font-size: 1.2rem;
            filter: drop-shadow(0 0 6px rgba(255,0,85,0.6));
        }
        .coming-soon-txt {
            letter-spacing: 3px;
            font-size: 9px !important;
            opacity: 0.7;
        }
        .back-arrow {
            position: fixed; top: 20px; left: 20px; z-index: 100;
            background: transparent; border: 2px solid rgba(255,255,255,0.2);
            color: white; width: 42px; height: 42px; border-radius: 50%;
            font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .back-arrow:hover { border-color: white; background: rgba(255,255,255,0.1); transform: scale(1.1); }

    </style>
</head>
<body>

    <div class="stars-wrapper"></div>
    <button class="back-arrow" onclick="window.location.href='Bbb.html'">←</button>

    <div id="global-loader">
        <div class="loader-grid-bg">
            <span>X</span><span>O</span><span>X</span>
            <span>O</span><span>X</span><span>O</span><span>X</span><span>O</span><span>X</span>
        </div>
        <div class="loader-xo-wrap">
            <span class="loader-letter X">X</span>
            <span class="loader-letter vs">VS</span>
            <span class="loader-letter O">O</span>
        </div>
        <div class="loader-box">
            <div class="loader-title">LOADING MATCH</div>
            <div class="bar-container"><div id="fill-bar"></div></div>
            <div class="loader-percent" id="percent-txt">0%</div>
        </div>
    </div>

    <h1 class="game-title">SELECT LEAGUE MODE</h1>

    <div class="menu-container">
        <!-- زرار AI LEAGUE -->
        <button class="mode-btn ai-neon" onclick="window.location.href='dev.html?v='+Date.now()">
            AI LEAGUE
            <span class="btn-subtext">Single Player Career</span>
        </button>

        <button class="mode-btn online-neon locked-btn" disabled>
            <span class="lock-icon">🔒</span>
            ONLINE LEAGUE
            <span class="btn-subtext coming-soon-txt">COMING SOON</span>
        </button>
    </div>

    <script>
        function goToPage(url) {
            const loader = document.getElementById('global-loader');
            const bar = document.getElementById('fill-bar');
            const txt = document.getElementById('percent-txt');
            if (loader.dataset.busy) return;          // نمنع الضغط المتكرر
            loader.dataset.busy = '1';
            loader.style.display = 'flex';
            const total = 3000, t0 = Date.now();      // نفس مدة تحميل dev
            const iv = setInterval(() => {
                const p = Math.min(100, Math.round((Date.now() - t0) / total * 100));
                bar.style.width = p + '%'; txt.innerText = p + '%';
                if (p >= 100) {
                    clearInterval(iv);
                    setTimeout(() => { window.location.href = url; }, 250);
                }
            }, 60);
        }

    </script>
</body>
</html>
